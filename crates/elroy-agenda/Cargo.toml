[package]
name = "elroy-agenda"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
elroy-config = { path = "../elroy-config" }
elroy-context = { path = "../elroy-context" }
elroy-core = { path = "../elroy-core" }
elroy-db = { path = "../elroy-db" }
elroy-recall = { path = "../elroy-recall" }
elroy-tools = { path = "../elroy-tools" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
elroy-llm = { path = "../elroy-llm" }
mockito = "1"
