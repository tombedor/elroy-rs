[package]
name = "elroy-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
elroy-agenda = { path = "../elroy-agenda" }
elroy-config = { path = "../elroy-config" }
elroy-context = { path = "../elroy-context" }
elroy-db = { path = "../elroy-db" }
elroy-memory = { path = "../elroy-memory" }
elroy-recall = { path = "../elroy-recall" }
elroy-tools = { path = "../elroy-tools" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
elroy-llm = { path = "../elroy-llm" }
